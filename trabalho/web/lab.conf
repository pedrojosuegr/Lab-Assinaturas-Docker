# Configuração do site HTTPS do laboratório (nginx)
# Os arquivos de trabalho/saida/web aparecem, dentro do contêiner do nginx, em /etc/nginx/lab
# Após qualquer alteração: docker compose restart web   (erros: docker compose logs web)

server {
    listen 443 ssl;
    server_name web.lab.local;

    # ---------------------------------------------------------------- T6
    ssl_certificate      /etc/nginx/lab/fullchain.pem;   # cadeia: servidor + intermediária
    ssl_certificate_key  /etc/nginx/lab/servidor.key;    # chave privada do servidor
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /etc/nginx/lab/www;
    index index.html;

    # ---------------------------------------------------------------- T7
    ssl_client_certificate /etc/nginx/lab/acs-confiaveis.pem;   # raiz + intermediária
    ssl_verify_client      optional;                            # o bloqueio é feito no location abaixo
    ssl_verify_depth       2;                                   # cliente -> intermediária -> raiz

    location /restrito {
        default_type text/plain;
        if ($ssl_client_verify != SUCCESS) {
            return 403 "Certificado de cliente ausente ou invalido\n";
        }
        return 200 "Acesso autorizado para $ssl_client_s_dn\n";
    }

    # ---------------------------------------------------------------- T8
    # TODO: ssl_crl  (arquivo com as LCRs)
}
