# Configuração do site HTTPS do laboratório (nginx)
# Os arquivos de trabalho/saida/web aparecem, dentro do contêiner do nginx, em /etc/nginx/lab
# Após qualquer alteração: docker compose restart web   (erros: docker compose logs web)

server {
    listen 443 ssl;
    server_name web.lab.local;

    # ---------------------------------------------------------------- T6
    # TODO: ssl_certificate      (arquivo com a cadeia: servidor + intermediária)
    # TODO: ssl_certificate_key  (chave privada do servidor)
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /etc/nginx/lab/www;
    index index.html;

    # ---------------------------------------------------------------- T7
    # TODO: ssl_client_certificate  (ACs aceitas para certificados de cliente)
    # TODO: ssl_verify_client       (usar "optional": o bloqueio é feito no location abaixo)
    # TODO: ssl_verify_depth        (quantos níveis de AC acima do certificado do cliente)

    location /restrito {
        default_type text/plain;
        # TODO: se $ssl_client_verify for diferente de SUCCESS, devolver 403
        return 200 "Acesso autorizado para $ssl_client_s_dn\n";
    }

    # ---------------------------------------------------------------- T8
    # TODO: ssl_crl  (arquivo com as LCRs)
}
